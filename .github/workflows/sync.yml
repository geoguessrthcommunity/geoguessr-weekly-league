name: GeoGuessr Weekly Challenge Auto Sync

on:
  schedule:
    # รันอัตโนมัติทุก 30 นาที (ใช้นาทีที่ 17 และ 47 เพื่อเลี่ยงคิวมหาชนตอนต้นชั่วโมงและครึ่งชั่วโมง)
    - cron: "17,47 * * * *"
  workflow_dispatch: # อนุญาตให้กดสั่งรันด้วยมือผ่านหน้าเว็บ GitHub ได้ตลอดเวลา

# ป้องกันคิวค้างซ้อน: หากมีรอบใหม่เข้ามา ให้ยกเลิกรอบเก่าที่กำลังค้างอยู่ทันที
concurrency:
  group: sync-scores
  cancel-in-progress: true

jobs:
  sync-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # ตัดจบงานทันทีหากค้างเกิน 5 นาที ป้องกันการกินโควตาและค้างคิว

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEOGUESSR_COOKIE: ${{ secrets.GEOGUESSR_COOKIE }}
          BOT_USER_ID: ${{ secrets.BOT_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ADMIN_CHANNEL_ID: ${{ secrets.DISCORD_ADMIN_CHANNEL_ID }}
        run: node sync.js
